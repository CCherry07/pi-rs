[package]
name = "pi-desktop"
version = "0.1.0"
description = "Pi Desktop client"
authors = ["Pi contributors"]
edition = "2021"
default-run = "pi-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pi_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dotenvy = "0.15"
tauri = { version = "2.11.5", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "io-util", "process", "rt", "sync", "time"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["formatting"] }
pi-agent = { path = "../../../crates/pi-agent" }
pi-core = { path = "../../../crates/pi-core" }
pi-runtime = { path = "../../../crates/pi-runtime" }
pi-sdk = { path = "../../../crates/pi-sdk" }
pi-session = { path = "../../../crates/pi-session" }
pi-plugin-skills = { path = "../../../plugins/features/pi-plugin-skills" }
tauri-plugin-dialog = "2.7.3"
git2 = { version = "0.20.3", features = ["vendored-openssl", "vendored-libgit2"] }
base64 = "0.22"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
ignore = "0.4.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
libc = "0.2"
chrono = { version = "0.4", features = ["clock"] }
toml_edit = "0.20.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "2"
cpal = "0.15"
whisper-rs = "0.12"
sha2 = "0.10"
portable-pty = "0.8"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"

[target."cfg(target_os = \"ios\")".dependencies]
objc2 = "0.6"

[dev-dependencies]
pi-test-support = { path = "../../../crates/pi-test-support" }
tempfile = "3"
