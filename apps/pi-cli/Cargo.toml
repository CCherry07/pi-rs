[package]
name = "pi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pi"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control", "image-data"] }
async-trait.workspace = true
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dotenvy.workspace = true
futures.workspace = true
fs2 = "0.4.3"
rpassword = "7.4"
pi-agent.workspace = true
pi-acp.workspace = true
pi-rpc.workspace = true
pi-core.workspace = true
pi-media.workspace = true
pi-tool-support.workspace = true
pi-plugin-manager.workspace = true
pi-js-package-manager.workspace = true
pi-js-plugin.workspace = true
pi-runtime.workspace = true
pi-session.workspace = true
pi-settings.workspace = true
pi-sdk.workspace = true
pi-plugin-openai.workspace = true
pi-plugin-xai.workspace = true
pi-plugin-models.workspace = true
pi-plugin-anthropic.workspace = true
pi-plugin-openrouter.workspace = true
pi-plugin-copilot.workspace = true
pi-plugin-skills.workspace = true
pi-plugin-session-transfer.workspace = true
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9.2", default-features = false }
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
termina = "0.3.3"
tempfile = "3.21.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "signal"] }
tui-realm-stdlib = "4.1.0"
tuirealm = { version = "4.1.0", default-features = false }
pulldown-cmark = "0.13"
unicode-width = "0.2"
uuid = { version = "1.18.1", features = ["v7"] }

[dev-dependencies]
pi-test-support.workspace = true
