[package]
name = "pi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pi"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
async-trait.workspace = true
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dotenvy.workspace = true
futures.workspace = true
fs2 = "0.4.3"
rpassword = "7.4"
pi-agent.workspace = true
pi-md.workspace = true
pi-core.workspace = true
pi-plugin-loader.workspace = true
pi-plugin-manager.workspace = true
pi-js-plugin.workspace = true
pi-resources.workspace = true
pi-runtime.workspace = true
pi-session.workspace = true
pi-plugin-openai.workspace = true
pi-plugin-xai.workspace = true
pi-plugin-models.workspace = true
pi-plugin-anthropic.workspace = true
pi-plugin-skills.workspace = true
pi-plugin-read.workspace = true
pi-plugin-write.workspace = true
pi-plugin-edit.workspace = true
pi-plugin-hashline-edit.workspace = true
pi-plugin-bash.workspace = true
pi-plugin-grep.workspace = true
pi-plugin-find.workspace = true
pi-plugin-ls.workspace = true
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9.2", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
termina = "0.3.3"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tui-realm-stdlib = "4.1.0"
tuirealm = { version = "4.1.0", default-features = false }
unicode-width = "0.2"
uuid = { version = "1.18.1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.21.0"
