[package]
name = "pi-plugin-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pi-plugin.workspace = true
pi-plugin-tool-search.workspace = true
async-trait.workspace = true
base64 = "0.22.1"
fs2 = "0.4.3"
futures.workspace = true
pi-core.workspace = true
pi-shell.workspace = true
sha2 = "0.10"
tempfile = "3.21.0"
# 3.3's concurrent HTTP worker can cancel a POST before response headers arrive.
rmcp = { version = "=3.3.0", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
sse-stream = "0.2.4"
# Match the existing provider transports; do not enable two competing rustls defaults.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http = "1"
oauth2 = { version = "5", default-features = false }
url = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }

[dev-dependencies]
rmcp = { version = "=3.3.0", default-features = false, features = ["client", "macros", "server", "transport-child-process", "transport-streamable-http-server"] }
axum = "0.8"
