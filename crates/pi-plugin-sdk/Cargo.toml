[package]
name = "pi-plugin-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
default = []
agent = []
provider = []
session = ["dep:pi-session"]

[dependencies]
async-trait.workspace = true
pi-core.workspace = true
pi-plugin-macros.workspace = true
pi-session = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
# `PluginOptionsValue` crosses the native Rust ABI. Pin its map representation so a
# host workspace cannot change the `serde_json::Value` layout through feature unification.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
