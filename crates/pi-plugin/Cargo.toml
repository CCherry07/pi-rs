[package]
name = "pi-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
native = ["dep:schemars", "serde_json/preserve_order"]

[dependencies]
pi-core.workspace = true
async-trait.workspace = true
futures-core.workspace = true
pi-plugin-macros.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Only channels are needed in production; the workspace preset also enables the runtime.
tokio = { version = "1.47.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "native-ui"
path = "examples/native-ui.rs"
crate-type = ["cdylib"]
required-features = ["native"]

[dev-dependencies]
futures.workspace = true
tokio.workspace = true
