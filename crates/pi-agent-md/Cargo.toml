[package]
name = "pi-agent-md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
description = "Incremental Markdown parsing and Ratatui rendering for Pi Agent"

[dependencies]
pulldown-cmark = "0.13"
ratatui-core = { version = "0.1.2", features = ["underline-color"] }
regex = "1"
unicode-width = "0.2"
