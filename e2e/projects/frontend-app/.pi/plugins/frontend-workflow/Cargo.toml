[package]
name = "frontend-workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pi-plugin-sdk = { path = "../../../../../../crates/pi-plugin-sdk", features = ["agent"] }
schemars = "1.2.1"
serde = { version = "1.0.219", features = ["derive"] }

[workspace]
resolver = "3"
