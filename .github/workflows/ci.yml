name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/pi/package-lock.json

      - name: Install release tooling
        working-directory: packages/pi
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Synchronize inherited workspace versions in Cargo.lock
        working-directory: packages/pi
        run: npm run --silent release:sync-lock

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check patch whitespace
        run: git diff --check

  tool-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/pi/package-lock.json

      - name: Install release tooling
        working-directory: packages/pi
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Synchronize inherited workspace versions in Cargo.lock
        working-directory: packages/pi
        run: npm run --silent release:sync-lock

      - name: Test real filesystem and shell behavior
        run: >-
          cargo test --locked
          -p pi-plugin-read -p pi-plugin-write -p pi-plugin-edit
          -p pi-plugin-hashline-edit -p pi-plugin-bash -p pi-plugin-powershell
          -p pi-plugin-grep -p pi-plugin-find -p pi-plugin-ls
          -p pi-tool-support -p pi-shell -p pi-media

  node-host:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/pi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/pi/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check Node host
        run: npm run check

      - name: Test Node host and release Module
        run: npm test

      - name: Test tool parity inventory checker
        run: node --test ../../scripts/check-tool-test-parity.test.mjs

      - name: Check frozen tool test references
        run: node ../../scripts/check-tool-test-parity.mjs

      - name: Validate release configuration
        run: npm run release:check

  native-bridge:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/pi
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/pi/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Synchronize inherited workspace versions in Cargo.lock
        run: npm run --silent release:sync-lock

      - name: Build native binding
        run: npm run build:native

      - name: Test Node to NAPI to Rust bridge
        run: npm run test:native
