name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/pi/package-lock.json

      - name: Install release tooling
        working-directory: packages/pi
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Synchronize inherited workspace versions in Cargo.lock
        working-directory: packages/pi
        run: npm run --silent release:sync-lock

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check patch whitespace
        run: git diff --check

  node-host:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/pi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/pi/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check Node host
        run: npm run check

      - name: Test Node host and release Module
        run: npm test

      - name: Validate release configuration
        run: npm run release:check

  product-e2e:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/pi
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: packages/pi/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Synchronize inherited workspace versions in Cargo.lock
        run: npm run --silent release:sync-lock

      - name: Run deterministic product E2E stack
        run: npm run e2e
